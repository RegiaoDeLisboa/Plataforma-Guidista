<title>Plataforma Guidista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap">
<style>
/* Cores do Manual de Imagem e Comunicação AGP (jan. 2023). Tema claro único, fiel ao manual. */
:root{
  color-scheme:light;
  --azul:#0e4074; --azul-claro:#00a3e0; --azul-noite:#021a38;
  --azul-20:#cfd9e3; --azul-10:#e7ecf1; --claro-20:#ccedf9; --claro-10:#e6f6fc; --claro-texto:#8fd3f4;
  --papel:#ffffff; --fundo:#f5f8fb; --linha:#dde5ee;
  --tinta:#0b2442; --tinta-2:#4a5d75; --tinta-3:#7d8ea3;
  --avezinha:#fde600; --aventura:#1a7f57; --caravela:#e57200; --moinho:#0545cf; --dirigente:#9e3223;
  --ok:#1a7f57; --ok-10:#e2f1ea; --alerta:#9e3223; --alerta-10:#f6e3e0;
  --gradiente:linear-gradient(165deg,#021a38 0%,#0a3a6b 45%,#0072b5 80%,#00a3e0 100%);
  --font:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--fundo);color:var(--tinta);font-family:var(--font);font-size:14.5px;line-height:1.55}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul-claro);outline-offset:2px}

/* ---------- elementos do manual ---------- */
.running{font-size:11px;line-height:1.25;letter-spacing:.02em;text-transform:uppercase}
.running span{display:block;color:var(--claro-texto)}
.rule{display:block;width:34px;height:2px;background:currentColor}
.painel{background:var(--gradiente);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.painel .trevos{position:absolute;inset:0;z-index:-1;pointer-events:none}
.painel .trevos path{fill:none;stroke:#4fc0ec;vector-effect:non-scaling-stroke}

/* ---------- entrada ---------- */
.entrada{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.entrada .painel{padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
.entrada .titulo{display:grid;gap:22px;max-width:440px}
.entrada .titulo h1{font-weight:300;font-size:clamp(34px,4.6vw,58px);letter-spacing:-.01em;text-transform:uppercase;line-height:1.02}
.entrada .titulo p{margin:0;font-weight:300;font-size:14px;max-width:360px;color:#dcecf8}
.entrada .lado{background:var(--papel);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.entrada form{width:min(380px,100%);display:grid;gap:18px}
.marca{display:flex;align-items:center;gap:12px;color:var(--azul)}
.marca img{height:58px;width:auto}
.marca b{font-weight:600;font-size:15px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em}
.entrada h2{font-size:22px;font-weight:700;text-transform:uppercase;color:var(--azul);margin-top:14px}
.entrada h2 + p{margin:-8px 0 4px;color:var(--tinta-2)}
label{display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em}
input,select{border:1px solid var(--linha);background:var(--papel);border-radius:4px;padding:11px 12px;font-size:14.5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--tinta);width:100%}
input:focus,select:focus{border-color:var(--azul-claro);outline:none;box-shadow:0 0 0 3px var(--claro-20)}
.erro{background:var(--alerta-10);color:var(--alerta);border-left:3px solid var(--alerta);padding:10px 12px;font-size:13.5px}
.teste{font-size:12.5px;color:var(--tinta-2);border-top:1px solid var(--linha);padding-top:14px}
.teste summary{cursor:pointer;font-weight:500;color:var(--azul)}
.teste ul{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr auto;gap:2px 16px;max-height:190px;overflow:auto}
.teste li{display:contents}

/* ---------- botões ---------- */
.btn{white-space:nowrap;border:1px solid var(--azul);background:var(--papel);color:var(--azul);border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--claro-10)}
.btn.primario{background:var(--azul);color:#fff}
.btn.primario:hover{background:#0b3560}
.btn.claro{background:var(--azul-claro);border-color:var(--azul-claro);color:#fff}
.btn.claro:hover{filter:brightness(1.07)}
.btn.pequeno{padding:6px 11px;font-size:11.5px}
.btn.texto{border-color:transparent;background:none;padding-inline:6px}

/* ---------- aplicação ---------- */
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:268px minmax(0,1fr)}
.lateral{padding:30px 22px 26px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh}
.lateral .marca{color:#fff}
.lateral .marca img{height:50px}
.lateral .marca b{font-size:12.5px}
.companhia{display:grid;gap:10px}
.companhia .rule{color:#fff}
.companhia h2{font-size:21px;font-weight:700;text-transform:uppercase;line-height:1.1}
.companhia p{margin:0;font-size:12px;color:var(--claro-texto);word-break:break-all}
.menu{display:grid;gap:2px;margin-inline:-10px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;color:#fff;text-align:left;padding:10px 10px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.menu button:hover:not([disabled]){background:rgba(255,255,255,.08)}
.menu button[aria-current="page"]{font-weight:600;background:rgba(255,255,255,.12)}
.menu button[aria-current="page"]::before{content:"";width:3px;align-self:stretch;background:var(--azul-claro);margin:-2px 0 -2px -10px;border-radius:2px}
.menu button .nome{flex:1}
.menu button[disabled]{cursor:default;color:rgba(255,255,255,.5)}
.menu .breve{font-size:10px;letter-spacing:.06em;color:var(--claro-texto)}
.menu .conta{background:#fff;color:var(--alerta);border-radius:99px;font-size:11px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.lateral .fim{margin-top:auto;display:grid;gap:12px}
.lateral .sair{background:none;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:4px;padding:8px 12px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.lateral .sair:hover{background:rgba(255,255,255,.08)}

.conteudo{background:var(--papel);padding:34px clamp(16px,4vw,52px) 60px;min-width:0}
.topo{display:flex;justify-content:flex-end;margin-bottom:10px}
.topo .running{color:var(--azul-claro)}
.cabecalho{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.cabecalho .num{font-weight:200;font-size:64px;line-height:.9;color:var(--azul-claro);letter-spacing:-.03em}
.cabecalho .rule{color:var(--azul);margin:12px 0 14px}
.cabecalho h1{font-size:30px;font-weight:700;text-transform:uppercase;color:var(--azul)}
.cabecalho p{margin:6px 0 0;color:var(--tinta-2);max-width:520px}

.aviso{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-left:4px solid var(--alerta);background:var(--alerta-10);padding:12px 16px;margin-bottom:24px}
.aviso b{color:var(--alerta);font-weight:600}

.numeros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);margin-bottom:28px}
.numeros div{padding:16px 18px;display:grid;gap:2px}
.numeros div + div{border-left:1px solid var(--linha)}
.numeros .n{font-size:38px;font-weight:300;color:var(--azul);font-variant-numeric:tabular-nums;line-height:1.1}
.numeros .n small{font-size:20px;color:var(--tinta-3)}
.numeros .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-2);font-weight:500}

.barra-tabela{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.barra-tabela h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--azul);font-weight:600}
.tabela{overflow-x:auto;border:1px solid var(--linha);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:840px}
th,td{padding:12px 12px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--azul);background:var(--claro-10);font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--fundo)}
td .nome{font-weight:600;color:var(--tinta);white-space:nowrap}
td.cargo{min-width:120px}
td.contactos{font-size:13px;overflow-wrap:anywhere;min-width:150px}
td .sub{display:block;font-size:12.5px;color:var(--tinta-3)}
td .falta{display:block;font-size:12px;color:var(--alerta)}
.num{font-variant-numeric:tabular-nums}
.ramo{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ramo i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 10px;border-radius:99px;white-space:nowrap}
.estado.ok{background:var(--ok-10);color:var(--ok)}
.estado.falta{background:var(--alerta-10);color:var(--alerta)}
.acoes{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.em-falta{color:var(--alerta);font-size:12.5px}
.nota{margin-top:14px;font-size:12.5px;color:var(--tinta-3);display:flex;gap:8px;align-items:flex-start;max-width:640px}
.nota svg{flex:none;margin-top:3px}
.vazio{padding:40px;text-align:center;color:var(--tinta-2)}

/* ---------- janelas ---------- */
.veu{position:fixed;inset:0;background:rgba(2,26,56,.6);display:grid;place-items:center;padding:16px;z-index:50}
.janela{background:var(--papel);width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:4px;box-shadow:0 24px 60px rgba(2,26,56,.35)}
.janela header{padding:22px 26px 20px}
.janela header .running{margin-bottom:14px}
.janela header h2{font-size:21px;font-weight:700;text-transform:uppercase}
.janela header p{margin:6px 0 0;font-size:13.5px;color:#dcecf8}
.janela .corpo{padding:22px 26px}
.janela.simples header{border-bottom:1px solid var(--linha)}
.janela.simples header h2{color:var(--azul)}
.janela.simples header p{color:var(--tinta-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.form .inteiro{grid-column:1/-1}
.rodape{display:flex;justify-content:flex-end;gap:8px;padding:0 26px 24px;flex-wrap:wrap}
.rodape .esq{margin-right:auto}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:0}
.lista li{padding:12px 0;border-bottom:1px solid var(--linha);display:grid;gap:2px}
.lista li:last-child{border-bottom:0}
.lista b{font-weight:600;font-size:14px}
.lista span{font-size:13px;color:var(--tinta-2)}
.lista .tipo{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--alerta);font-weight:600}
.caixa{background:var(--claro-10);border-left:3px solid var(--azul-claro);padding:12px 14px;font-size:13px;color:var(--tinta-2)}
.ficheiro{border:1.5px dashed var(--azul-20);border-radius:4px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--tinta-2);font-size:13px}
.ficheiro input{max-width:280px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;padding:11px 20px;border-radius:4px;font-weight:500;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(2,26,56,.3)}

@media (max-width:900px){
  .entrada{grid-template-columns:1fr}
  .entrada .painel{min-height:0;padding:28px 20px;gap:40px}
  .app{grid-template-columns:1fr}
  .lateral{position:relative;height:auto;padding:18px 16px;gap:16px}
  .lateral .fim{margin-top:0;grid-template-columns:1fr auto;align-items:center}
  .menu{display:flex;overflow-x:auto;margin:0}
  .menu button{white-space:nowrap}
  .menu button[aria-current="page"]::before{display:none}
  .conteudo{padding-top:22px}
  .cabecalho .num{font-size:48px}
}
@media (max-width:600px){
  .numeros{grid-template-columns:1fr}
  .numeros div + div{border-left:0;border-top:1px solid var(--linha)}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.janela{animation:sobe .18s ease-out}@keyframes sobe{from{transform:translateY(8px);opacity:.5}}}

/* ---------- tesouraria ---------- */
.numeros.quatro{grid-template-columns:repeat(4,minmax(0,1fr))}
.numeros .destaque .n{color:var(--alerta)}
.numeros .l .fonte{display:inline-flex;gap:4px;align-items:center;text-transform:none;letter-spacing:0;color:var(--tinta-3);font-weight:400;font-size:11.5px;margin-left:4px}
.seccao{margin-top:38px}
.seccao:first-of-type{margin-top:0}
.seccao > .barra-tabela{margin-bottom:14px}
.seccao > .barra-tabela p{margin:2px 0 0;font-size:13px;color:var(--tinta-2)}
.conta-bancaria{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);border:1px solid var(--linha);border-radius:4px}
.conta-bancaria > div{padding:18px 20px;display:grid;gap:6px;align-content:start}
.conta-bancaria > div + div{border-left:1px solid var(--linha)}
.rotulo{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-3);font-weight:600}
.iban{font-size:19px;font-weight:500;color:var(--azul);letter-spacing:.04em;font-variant-numeric:tabular-nums;word-break:break-word}
.titulares{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.titulares li{display:flex;gap:10px;align-items:baseline}
.titulares li span{font-size:12.5px;color:var(--tinta-3)}
.titulares li.vaga{color:var(--alerta);font-size:13.5px}
.aviso.suave{border-left-color:var(--caravela);background:#fdf0e3}
.aviso.suave b{color:#9a4d00}
.grafico{border:1px solid var(--linha);border-radius:4px;padding:18px 20px 12px;position:relative}
.grafico h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--azul);font-weight:600}
.grafico .sub{font-size:12.5px;color:var(--tinta-3);margin:0 0 12px}
.graficos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tinta-2);margin-top:10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:2px;display:inline-block}
.legenda i.linha{height:3px;border-radius:2px}
.barra-empilhada{display:flex;gap:2px;height:36px;margin:8px 0 4px}
.barra-empilhada div{height:100%;min-width:3px;position:relative}
.barra-empilhada div:first-child{border-radius:4px 0 0 4px}
.barra-empilhada div:last-child{border-radius:0 4px 4px 0}
.tracejado{background:repeating-linear-gradient(135deg,var(--claro-10) 0 6px,var(--azul-20) 6px 8px)}
.valores-barra{display:grid;gap:8px;margin-top:14px}
.valores-barra div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px dashed var(--linha);padding-bottom:6px}
.valores-barra div:last-child{border-bottom:0}
.valores-barra b{font-weight:600;font-variant-numeric:tabular-nums}
.valores-barra i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:8px}
.linha-svg{width:100%;height:auto;display:block;overflow:visible}
.linha-svg text{font-family:var(--font);font-size:11px;fill:var(--tinta-3)}
.linha-svg .grelha{stroke:var(--linha);stroke-width:1}
.dica{position:absolute;pointer-events:none;background:var(--azul-noite);color:#fff;border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 20px rgba(2,26,56,.25);transform:translate(-50%,-110%)}
.dica b{font-weight:600}
.estado.analise{background:var(--claro-10);color:#0072b5}
.estado.devolvida{background:var(--alerta-10);color:var(--alerta)}
td.valor{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
th.valor{text-align:right}
@media (max-width:1100px){.graficos{grid-template-columns:1fr}}
@media (max-width:760px){
  .numeros.quatro{grid-template-columns:1fr 1fr}
  .numeros.quatro div:nth-child(3){border-left:0}
  .numeros.quatro div:nth-child(n+3){border-top:1px solid var(--linha)}
  .conta-bancaria{grid-template-columns:1fr}
  .conta-bancaria > div + div{border-left:0;border-top:1px solid var(--linha)}
}

/* ---------- separadores, envio, companhia ---------- */
.separadores{display:flex;gap:2px;border-bottom:1px solid var(--linha);margin:-6px 0 28px;overflow-x:auto}
.separadores button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta-2);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.separadores button:hover{color:var(--azul)}
.separadores button[aria-selected="true"]{color:var(--azul);font-weight:600;border-bottom-color:var(--azul-claro)}
.separadores .conta{background:var(--alerta);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:0 6px;min-width:18px;text-align:center}
.enviar{border:1.5px dashed var(--azul-claro);background:var(--claro-10);border-radius:4px;padding:30px 20px;display:grid;justify-items:center;gap:4px;text-align:center;cursor:pointer;color:var(--tinta-2);font-size:13.5px}
.enviar b{color:var(--azul);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.enviar:hover{background:var(--claro-20)}
.medidor{height:10px;background:var(--azul-10);border-radius:99px;overflow:hidden;margin-top:-10px}
.medidor div{height:100%;background:var(--azul);border-radius:99px}
.barras-orc div{height:7px;margin:3px 0}
.barras-orc i{display:block;height:100%;border-radius:0 3px 3px 0;min-width:2px}
.ramos-lista{display:grid;gap:16px}
.ramo-linha{display:grid;gap:6px}
.ramo-nome{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta-3)}
.ramo-nome .ramo{font-size:14px;color:var(--tinta);font-weight:500}
.ramo-barra{display:flex;align-items:center;gap:10px}
.ramo-barra div{height:22px;border-radius:0 4px 4px 0;min-width:4px}
.ramo-barra b{font-weight:600;font-variant-numeric:tabular-nums}
.form.censos{grid-template-columns:1.4fr 1fr 1fr;align-items:center;gap:10px 14px}
.form.censos .inteiro{grid-column:1/-1}
@media (max-width:600px){.form.censos{grid-template-columns:1.2fr 1fr 1fr}}

.faturas-topo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:stretch}
.faturas-topo .enviar{align-content:center}
.orc-grelha{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.orc-tabela td{padding:8px 6px}
.orc-tabela td:first-child{padding-left:10px}
.orc-tabela tfoot td{font-weight:600;color:var(--azul);background:var(--claro-10);border-top:1px solid var(--linha);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.orc-tabela tfoot td.valor{font-size:15px;text-transform:none;letter-spacing:0}
.celula{border:1px solid transparent;background:transparent;padding:8px 9px;border-radius:4px;font-size:14px}
.celula:hover{border-color:var(--linha)}
.celula:focus{border-color:var(--azul-claro);background:var(--papel)}
.celula-valor{display:flex;align-items:center;gap:4px}
.celula-valor input{text-align:right;font-variant-numeric:tabular-nums}
.celula-valor span{color:var(--tinta-3)}
.grupos{display:grid;gap:12px}
.grupo-linha{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.grupo-nome{color:var(--tinta)}
.grupo-barra{height:16px;background:var(--azul-10);border-radius:0 4px 4px 0}
.grupo-barra div{height:100%;border-radius:0 4px 4px 0;min-width:3px}
.grupo-valor{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grupo-valor small{display:block;font-weight:400;color:var(--tinta-3);font-size:11px}
tfoot td{border-bottom:0}
@media (max-width:1100px){.faturas-topo,.orc-grelha{grid-template-columns:1fr}}

/* ---------- atividades ---------- */
.ativ-lista{display:grid;gap:12px}
.ativ-cartao{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;text-align:left;background:var(--papel);border:1px solid var(--linha);border-radius:4px;padding:18px 22px;cursor:pointer;width:100%}
.ativ-cartao:hover{border-color:var(--azul-claro);box-shadow:0 6px 20px rgba(2,26,56,.06)}
.ativ-data{display:grid;justify-items:center;min-width:64px;padding-right:22px;border-right:1px solid var(--linha)}
.ativ-data span{font-size:34px;font-weight:200;color:var(--azul-claro);line-height:1}
.ativ-data small{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-2);font-weight:500;margin-top:4px}
.ativ-info{display:grid;gap:4px}
.ativ-info h3{font-size:18px;font-weight:700;text-transform:uppercase;color:var(--azul)}
.ativ-info .rotulo{color:var(--azul-claro)}
.ativ-meta{font-size:13px;color:var(--tinta-2)}
.ativ-estado{display:grid;justify-items:end;gap:6px;text-align:right}
.ativ-estado .sub{font-size:12.5px;color:var(--tinta-3);display:flex;gap:8px;align-items:center}
.ativ-factos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);margin-bottom:26px}
.ativ-factos div{padding:14px 18px;display:grid;gap:4px}
.ativ-factos div + div{border-left:1px solid var(--linha)}
.ativ-factos b{font-weight:500;color:var(--tinta)}
.conf-grelha{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.conf-blocos{display:grid;gap:14px}
.conf-grupo{border:1px solid var(--linha);border-radius:4px}
.conf-cab{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--claro-10);border-bottom:1px solid var(--linha)}
.conf-cab .ramo{font-weight:600;color:var(--azul);text-transform:uppercase;font-size:13px;letter-spacing:.03em}
.conf-cab .sub{font-size:12.5px;color:var(--tinta-3);margin-right:auto}
.conf-nomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px;padding:10px}
.conf-nome{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:4px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--tinta)}
.conf-nome:hover{background:var(--fundo)}
.conf-nome input{width:18px;height:18px;accent-color:var(--azul);flex:none;margin:0}
.conf-nome:has(input:checked){background:var(--claro-10)}
.conf-resumo{position:sticky;top:24px;border:1px solid var(--linha);border-top:4px solid var(--azul);border-radius:4px;padding:18px;display:grid;gap:14px}
.conf-num{display:flex;gap:20px;font-size:13px;color:var(--tinta-2)}
.conf-num b{display:block;font-size:34px;font-weight:300;color:var(--azul);line-height:1.1;font-variant-numeric:tabular-nums}
.conf-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--linha);padding-top:12px}
.conf-total span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-2);font-weight:500}
.conf-total b{font-size:22px;font-weight:600;color:var(--azul);font-variant-numeric:tabular-nums}
textarea{border:1px solid var(--linha);border-radius:4px;padding:10px 12px;font:inherit;font-size:14px;color:var(--tinta);resize:vertical;text-transform:none;letter-spacing:0;font-weight:400;width:100%}
textarea:focus{border-color:var(--azul-claro);outline:none;box-shadow:0 0 0 3px var(--claro-20)}
.conf-resumo .sub{font-size:12.5px;color:var(--tinta-3)}
.pag-linha{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--linha);border-radius:4px;padding:14px 16px}
.pag-linha .sub{font-size:13px;color:var(--tinta-2)}
.seccao.espaco{margin-top:38px}
.back{background:none;border:0;color:var(--azul);cursor:pointer;padding:0;margin-bottom:18px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;display:inline-flex;gap:6px;align-items:center}
.back::before{content:"";width:14px;height:1.5px;background:currentColor}
@media (max-width:1000px){.conf-grelha{grid-template-columns:1fr}.conf-resumo{position:static}}
@media (max-width:700px){
  .ativ-cartao{grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px}
  .ativ-data{padding-right:14px}
  .ativ-estado{grid-column:1/-1;justify-items:start;text-align:left}
  .ativ-factos{grid-template-columns:1fr 1fr}
  .ativ-factos div:nth-child(3){border-left:0}
  .ativ-factos div:nth-child(n+3){border-top:1px solid var(--linha)}
}

/* ---------- empréstimos e navegação ---------- */
a.btn{text-decoration:none}
.conteudo h1:focus{outline:none}
.migalhas{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;flex-wrap:wrap}
.migalhas a{color:var(--azul-claro);text-decoration:none}
.migalhas a:hover{text-decoration:underline}
.migalhas svg{color:var(--tinta-3)}
.migalhas span{color:var(--tinta-2)}
.emp-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.emp-cartao{border:1px solid var(--linha);border-radius:4px;padding:18px 20px;display:grid;gap:14px;align-content:start}
.emp-topo{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.emp-topo h3{font-size:15px;font-weight:600;color:var(--tinta);margin-top:4px;line-height:1.35}
.emp-topo .rotulo{color:var(--azul-claro)}
.emp-datas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.emp-datas div{padding:10px 12px;display:grid;gap:1px}
.emp-datas div:first-child{padding-left:0}
.emp-datas div + div{border-left:1px solid var(--linha)}
.emp-datas b{font-weight:500;font-variant-numeric:tabular-nums}
.emp-datas span:not(.rotulo){font-size:12.5px;color:var(--tinta-3)}
.emp-nota{margin:0;font-size:13px;color:var(--tinta-2)}
.emp-nota.recusa{color:var(--alerta)}
.estado.neutro{background:var(--azul-10);color:var(--tinta-2)}
.catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px 24px}
.cat-grupo{display:grid;gap:0;align-content:start}
.cat-grupo > .rotulo{padding-bottom:6px;border-bottom:2px solid var(--azul);color:var(--azul)}
.cat-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha)}
.cat-item > div:first-child{display:grid}
.cat-item b{font-weight:500}
.cat-item span{font-size:12.5px;color:var(--tinta-3)}
.cat-qtd{font-size:20px!important;font-weight:300;color:var(--azul)!important;font-variant-numeric:tabular-nums}
.cat-item.esgotado b{color:var(--tinta-3)}
.passos{display:grid;gap:18px}
.passo{border:1px solid var(--linha);border-radius:4px;padding:18px 20px}
.passo-cab{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.passo-cab h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--azul);font-weight:600}
.passo-cab .sub{margin-left:auto;font-size:12.5px;color:var(--tinta-3)}
.passo-n{width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.passo .catalogo{grid-template-columns:1fr}
#p-material{display:grid;gap:18px}
.data-hora{display:grid;grid-template-columns:1fr 100px;gap:6px}
.cat-item .stepper{display:flex;align-items:center;border:1px solid var(--linha);border-radius:4px;flex:none}
.stepper button{width:34px;height:34px;border:0;background:none;font-size:18px;color:var(--azul);cursor:pointer}
.stepper button:disabled{color:var(--azul-20);cursor:default}
.stepper output{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.resumo-itens{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.resumo-itens li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px dashed var(--linha);padding-bottom:6px}
.resumo-datas{display:grid;gap:4px;margin-top:12px;font-size:12.5px;color:var(--tinta-2)}
.resumo-datas b{font-weight:600;color:var(--tinta)}
@media (max-width:600px){.emp-lista{grid-template-columns:1fr}.emp-datas{grid-template-columns:1fr 1fr 1fr}}

/* ---------- revisão ---------- */
.datas-pessoa{font-size:12.5px;line-height:1.55;font-variant-numeric:tabular-nums}
.datas-pessoa span{white-space:nowrap}
.datas-pessoa small{display:inline-block;min-width:88px;color:var(--tinta-3);font-size:11.5px}
.datas-pessoa .caducado,.datas-pessoa .caducado small{color:var(--alerta)}
.datas-pessoa span{display:block}
.mes-linha td{background:var(--fundo);padding:9px 12px}
.mes-linha b{font-weight:600;color:var(--azul);text-transform:uppercase;font-size:12px;letter-spacing:.05em;margin-right:12px}
.mes-linha span{font-size:12px;color:var(--tinta-3)}
.quotas-tabela tfoot td{font-weight:600;color:var(--azul);background:var(--claro-10);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.quotas-tabela tfoot td.valor{font-size:15px;text-transform:none;letter-spacing:0}
.ciclo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--linha);border-radius:4px}
.ciclo-passo{padding:14px 18px;display:grid;gap:2px;font-size:13px;color:var(--tinta-2);position:relative}
.ciclo-passo + .ciclo-passo{border-left:1px solid var(--linha)}
.ciclo-mes{font-size:16px;font-weight:600;color:var(--azul);text-transform:uppercase;letter-spacing:.03em}
.ciclo-passo.atual{background:var(--claro-10);box-shadow:inset 0 3px 0 var(--azul-claro)}
.tag-pa{margin-left:2px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--caravela);background:#fdf0e3;border-radius:99px;padding:1px 7px;white-space:nowrap}
.amigas{display:flex;flex-wrap:wrap;gap:8px;padding:12px;align-items:center}
.amiga{display:inline-flex;align-items:center;gap:6px;background:var(--claro-10);border-radius:99px;padding:4px 6px 4px 12px;font-size:13.5px}
.amiga button{border:0;background:none;color:var(--tinta-3);cursor:pointer;font-size:16px;line-height:1;width:22px;height:22px;border-radius:50%}
.amiga button:hover{background:var(--claro-20);color:var(--alerta)}
.amiga-nova{display:flex;gap:8px;flex:1 1 100%}
.amiga-nova input{flex:1;padding:8px 10px}
@media (max-width:700px){.ciclo{grid-template-columns:1fr}.ciclo-passo + .ciclo-passo{border-left:0;border-top:1px solid var(--linha)}}

/* ---------- Comissariado Regional ---------- */
.faixa-cr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft,#f6ebcf);border-left:4px solid var(--azul);padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.faixa-cr{background:var(--claro-10)}
.sub-menu{display:grid;gap:2px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.sub-menu .rotulo{color:var(--claro-texto);padding:0 10px 4px}
.sub-menu button{font-size:12.5px;padding:7px 10px 7px 20px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filtros button{border:1px solid var(--linha);background:var(--papel);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--tinta-2);display:inline-flex;gap:8px;align-items:center}
.filtros button span{background:var(--azul-10);border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:600}
.filtros button[aria-selected="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.filtros button[aria-selected="true"] span{background:rgba(255,255,255,.2)}
.pedidos{display:grid;gap:10px}
.pedido{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--linha);border-radius:4px;padding:14px 18px}
.pedido-info{display:grid;gap:3px}
.pedido-info .rotulo{color:var(--azul-claro)}
.pedido-info b{font-weight:600}
.pedido-info .sub{font-size:13px;color:var(--tinta-2)}
a.ccard{text-decoration:none;color:inherit}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}
@media (max-width:700px){.pedido{grid-template-columns:1fr}}

/* ---------- CR: atividades e modo consulta ---------- */
a.ativ-cartao{text-decoration:none;color:inherit;grid-template-columns:auto minmax(0,1fr)}
.mini-contagens{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini-contagens span{background:var(--claro-10);border-radius:4px;padding:3px 9px;font-size:12px;color:var(--tinta-2)}
.mini-contagens b{font-weight:600;color:var(--azul);margin-right:5px}
.contagem{border:1px solid var(--linha);background:var(--papel);border-radius:4px;min-width:38px;padding:4px 8px;font-weight:600;color:var(--azul);cursor:pointer;font-variant-numeric:tabular-nums}
.contagem:hover{border-color:var(--azul-claro);background:var(--claro-10)}
.contagem.obs{font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tabela-ativ th,.tabela-ativ td{padding:10px 7px}
.tabela-ativ th{font-size:10.5px;letter-spacing:.04em}
.tabela-ativ th:first-child,.tabela-ativ td:first-child{padding-left:14px}
.tabela-ativ th .ramo{gap:5px}
.link-obs{display:block;border:0;background:none;padding:0;color:var(--azul-claro);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline}
.tabela-ativ tfoot td{font-weight:600;color:var(--azul);background:var(--claro-10)}
.nomes-bloco{margin-bottom:14px}
.nomes-bloco ul{margin:6px 0 0;padding:0;list-style:none;columns:2;column-gap:20px}
.nomes-bloco li{padding:3px 0;border-bottom:1px dashed var(--linha);break-inside:avoid;font-size:14px}
.modo-cr [data-acao],.modo-cr #adicionar,.modo-cr [data-editar],.modo-cr [data-registo],.modo-cr #novaAtiv,.modo-cr [data-remover-ativ],.modo-cr [data-pagar-pa],.modo-cr [data-pagar-ativ],.modo-cr [data-reembolso-ativ],.modo-cr [data-reenviar],.modo-cr #guardarInsc,.modo-cr [data-cancelar-emp],.modo-cr a[href*="emprestimos/novo"],.modo-cr .amiga-nova,.modo-cr [data-todas],.modo-cr [data-rem-amiga],.modo-cr #verPendentes{display:none!important}
.modo-cr .celula,.modo-cr .conf-nome input,.modo-cr #r-obs{pointer-events:none}
@media (max-width:600px){.nomes-bloco ul{columns:1}}

.pag-historico{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.pag-historico li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;font-size:13px;color:var(--tinta-2);padding:6px 16px;border-bottom:1px dashed var(--linha)}

.al-dia{display:grid;gap:8px;margin-bottom:22px}
.al-dia > .rotulo{color:var(--azul);border-bottom:2px solid var(--azul);padding-bottom:6px}
.al-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--linha);border-radius:4px;padding:12px 16px}
.al-item div:first-child{display:grid;gap:2px}
.al-item .rotulo{color:var(--tinta-3)}
.al-item b{font-weight:500}
.al-item.nova{border-left:4px solid var(--azul-claro);background:var(--claro-10)}
.al-item.nova b{font-weight:600}
.prazos-lista{display:grid;gap:10px}
.prazo-linha{display:grid;grid-template-columns:minmax(0,1fr) 190px 150px;gap:16px;align-items:center;border:1px solid var(--linha);border-radius:4px;padding:16px 18px}
.prazo-linha > div{display:grid;gap:3px}
.prazo-linha .sub{font-size:13px;color:var(--tinta-2)}
.prazo-linha .estado{justify-self:start}
.urgente{background:var(--alerta);color:#fff;border-radius:3px;padding:1px 6px;margin-right:4px}
.papel-lista{margin-top:24px;border:1px solid var(--linha);border-radius:4px;padding:14px 18px}
.papel-lista summary{cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--azul);text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.papel-lista summary span{background:var(--azul-10);border-radius:99px;padding:0 8px;font-size:12px}
.papel-lista[open] summary{margin-bottom:12px}
.papel-comp{display:grid;gap:2px;margin-bottom:12px}
.papel-comp .rotulo{color:var(--azul-claro)}
@media (max-width:760px){.prazo-linha{grid-template-columns:1fr}.al-item{grid-template-columns:1fr}}

.cargo-sel{display:grid;grid-template-columns:1fr;gap:6px}
.cargo-sel:has(.cargo-outro:not([hidden])){grid-template-columns:1fr 1fr}
.cargos-extra-bloco{display:grid;gap:8px;justify-items:start}
#cargos-extra{display:grid;gap:8px;width:100%}
.cargo-extra{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ativ-textos{display:grid;gap:18px;border:1px solid var(--azul-20);border-left:3px solid var(--azul-claro);padding:18px 20px;margin:0 0 24px;background:#fff}
.ativ-texto h4{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--azul)}
.ativ-texto p{margin:0;font-size:14px;line-height:1.7;color:var(--tinta-2)}
.filtros-ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin:0 0 14px}
.filtros-ct label{display:grid;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta-3)}
.filtros-ct select,.filtros-ct input{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--azul-20);background:#fff;color:var(--tinta)}
.filtros-ct .ct-acoes{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.fatura-lida{display:grid;grid-template-columns:1fr 130px 160px;gap:12px;align-items:end;padding:10px 0;border-top:1px solid var(--azul-10)}
.fatura-lida .fl-nome{display:grid;gap:2px;min-width:0}
.fatura-lida .fl-nome b{font-size:13px;color:var(--tinta);overflow-wrap:anywhere}
.fatura-lida label{display:grid;gap:4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta-3)}
.fatura-lida input{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--azul-20);color:var(--tinta)}

.recado{border:1px solid var(--azul-20);border-left:3px solid var(--azul-claro);background:var(--claro-10);padding:14px 16px;margin:0 0 24px}
.recado .rotulo{color:var(--azul-claro)}
.recado p{margin:6px 0 0;font-size:14px;line-height:1.6;color:var(--tinta)}
.cr-barra{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--azul-20);border:1px solid var(--azul-20);margin:0 0 22px}
.cr-barra div{background:#fff;padding:14px 16px;display:grid;gap:3px}
.cr-barra .n{font-size:27px;font-weight:600;color:var(--azul);line-height:1}
.cr-barra .n small{font-size:14px;font-weight:400;color:var(--tinta-3)}
.cr-barra .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--tinta-3)}
.sinal{display:inline-flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--tinta-2)}
.sinal:before{content:"";width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--ok);transform:translateY(-1px)}
.sinal.s-aviso:before{background:#c08019}
.sinal.s-mal:before{background:var(--alerta)}
.sinal.s-vazio:before{background:var(--azul-20)}
.cr-tabela table{min-width:1100px}
.cr-tabela th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.cr-tabela th button:hover{color:var(--azul-claro)}
.cr-tabela th[aria-sort] button:after{content:"\25B2";font-size:8px}
.cr-tabela th[aria-sort="descending"] button:after{content:"\25BC"}
.cr-tabela .nome-comp{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--azul);cursor:pointer;text-align:left;display:block}
.cr-tabela .nome-comp:hover{color:var(--azul-claro)}
.cr-tabela tr.aberta>td{background:var(--claro-10)}
.cr-detalhe>td{background:var(--claro-10);border-top:0}
.cr-detalhe .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;padding:2px 0 14px}
.cr-detalhe h5{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--azul)}
.cr-detalhe ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.6;color:var(--tinta-2)}
.recado-cr{border:1px solid var(--azul-20);margin:0 0 22px;background:#fff}
.recado-cr summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;color:var(--azul)}
.recado-cr .dentro{padding:0 16px 16px;display:grid;gap:10px}
.recado-cr textarea{width:100%;min-height:86px;font:inherit;font-size:14px;line-height:1.6;padding:10px 12px;border:1px solid var(--azul-20);resize:vertical;color:var(--tinta)}
.saidas{margin:22px 0 0;border:1px solid var(--azul-20);background:#fff}
.saidas summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;color:var(--tinta-2)}
.saidas .tabela{margin:0 16px 16px}
</style>

function ibanLimpo(s){return String(s||"").replace(/\s+/g,"").toUpperCase()}
function ibanFormatado(s){return ibanLimpo(s).replace(/(.{4})/g,"$1 ").trim()}
function ibanValido(s){
  const i=ibanLimpo(s);
  if(!/^PT50\d{21}$/.test(i)) return false;
  const r=(i.slice(4)+i.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);
  let m=0; for(const ch of r) m=(m*10+ +ch)%97; return m===1;
}
function gerarIban(seed){
  let base=""; let x=seed*7919+12345; for(let i=0;i<19;i++){x=(x*1103515245+12345)%2147483648;base+=x%10}
  for(let k=0;k<100;k++){const c="PT50"+base+String(k).padStart(2,"0"); if(ibanValido(c)) return c}
  return "";
}

function exemploCensos(){

function contasQuotas(id){
  const c=BD.censos[id], t=BD.tesouraria[id];
  if(!c.atual) return {devido:null};
  const linhas=RAMOS_CENSOS.map(r=>{const g=+c.atual.ramos[r].guias; return {ramo:r,guias:g,valorGuias:g*QUOTA_GUIA,aberto:g>0,valorRamo:g>0?QUOTA_RAMO_ABERTO:0}});
  const devido=linhas.reduce((a,l)=>a+l.valorGuias+l.valorRamo,0);

  const at=s.atual.ramos, tot=totaisCensos(at), ant=s.historico[ANO-1]?totaisCensos(s.historico[ANO-1]):null;
  const varia=ant?tot.guias-ant.guias:null, maxG=Math.max(...RAMOS_CENSOS.map(r=>+at[r].guias),1);
  const razao=(g,d)=>(g/Math.max(1,d)).toFixed(1).replace(".",",");
  return cabec+`

    <div><span class="n">${tot.guias}</span><span class="l">Guias${varia!=null?` · <span style="color:${varia>=0?"var(--ok)":"var(--alerta)"}">${varia>0?"+":""}${varia} face a ${anoGuidista(ANO-1)}</span>`:""}</span></div>
    <div><span class="n">${tot.dirigentes}</span><span class="l">Dirigentes</span></div>
    <div><span class="n">${s.atual.novas}</span><span class="l">Novas guias</span></div>
  </div>
  <div class="graficos">
    <div class="grafico"><h4>Por ramo</h4><p class="sub">Guias e dirigentes em cada ramo.</p>
      <div class="ramos-lista">${RAMOS_CENSOS.map(r=>{const g=+at[r].guias,d=+at[r].dirigentes;return `<div class="ramo-linha">
        <div class="ramo-nome"><span class="ramo"><i style="background:${RAMOS[r]}"></i>${r}</span><span>${d} ${d===1?"dirigente":"dirigentes"} · ${razao(g,d)} ${r==="Avezinha"?"avezinhas":"guias"} por dirigente</span></div>
        <div class="ramo-barra"><div style="width:${g/maxG*100}%;background:${RAMOS[r]}" title="${r}: ${g}"></div><b>${g}</b></div></div>`}).join("")}</div>
      <p class="sub" style="margin:14px 0 0">No total, ${razao(tot.guias,tot.dirigentes)} guias por dirigente.</p>
    </div>
    ${evolucao(s,at)}
  </div>${ciclo}`;
}
function evolucao(s,atual){
  const dados=Object.keys(s.historico).map(Number).sort().map(a=>({ano:a,r:s.historico[a]}));
  if(atual) dados.push({ano:ANO,r:atual});
  const W=560,H=250,L=36,R=16,T=22,B=30, tots=dados.map(d=>totaisCensos(d.r).guias), topo=Math.ceil(Math.max(...tots,10)/10)*10;
  const cw=Math.min(90,(W-L-R)/Math.max(3,dados.length)*0.55), gap=(W-L-R)/Math.max(1,dados.length), y=v=>T+(H-T-B)*(1-v/topo);
  const grelha=[];for(let v=0;v<=topo;v+=topo>40?20:10)grelha.push(`<line class="grelha" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  const cols=dados.map((d,i)=>{let acc=0; const cx=L+gap*i+(gap-cw)/2;
    const segs=RAMOS_CENSOS.map(r=>{const v=+d.r[r].guias; const y0=y(acc), y1=y(acc+v); acc+=v; return `<rect x="${cx}" y="${y1+1}" width="${cw}" height="${Math.max(0,y0-y1-2)}" fill="${RAMOS[r]}"><title>${anoGuidista(d.ano)} · ${r}: ${v} guias</title></rect>`}).join("");
    return segs+`<text x="${cx+cw/2}" y="${y(acc)-6}" text-anchor="middle" style="fill:var(--tinta);font-weight:600;font-size:12px">${acc}</text><text x="${cx+cw/2}" y="${H-8}" text-anchor="middle">${anoGuidista(d.ano)}</text>`}).join("");
  return `<div class="grafico"><h4>Evolução</h4><p class="sub">Número de guias por ramo nos últimos censos.</p>
    <svg class="linha-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Guias por ano: ${dados.map((d,i)=>anoGuidista(d.ano)+" "+tots[i]).join(", ")}">${grelha.join("")}${cols}</svg>
    <div class="legenda">${RAMOS_CENSOS.map(r=>`<span><i style="background:${RAMOS[r]}"></i>${r}</span>`).join("")}</div></div>`;
}

async function exportarContactos(){

  const q=contasQuotas(id), pa=t.admissoes.filter(a=>a.estado!=="pago"), reem=t.reembolsos.filter(r=>r.estado==="pedido");
  const mal=[];

    : (abertas.length||porPagar.length) ? {n:"aviso", t:[abertas.length?abertas.length+" por confirmar":"", porPagar.length?porPagar.length+" por pagar":""].filter(Boolean).join(" · "),
        d:[...abertas.map(a=>a.nome+" — confirmar até "+fmt(a.prazo)), ...porPagar.map(a=>a.nome+" — falta pagar "+eur(contaPag(a,ins[a.id]).falta))]}
    : {n:"ok", t:(BD.atividades||[]).length?"Tudo confirmado":"Sem atividades", d:[]};
  const es=(BD.emprestimos||[]).filter(e=>e.comp===id);
  const pedidos=es.filter(e=>e.estado==="pedido"), atraso=es.filter(e=>e.estado==="levantado"&&e.devolucao&&passou(e.devolucao.data)), fora=es.filter(e=>e.estado==="levantado"&&!(e.devolucao&&passou(e.devolucao.data)));

function aplicarRota(){

      E.chaveRota=location.hash; fechar(); desenhar(); window.scrollTo(0,0); verificarAlteracoesCR(); return; }
  }
  const [pag,sub]=partes;
  const paginas=["companhia","patrulha","tesouraria","atividades","emprestimos"];
  E.pagina=paginas.includes(pag)?pag:"companhia";
  E.sep=E.pagina==="tesouraria"&&SEPARADORES.some(s=>s[0]===sub)?sub:"conta";
  const ativ=E.pagina==="atividades"&&ativs().some(a=>a.id===sub)?sub:null;
  if(ativ!==E.ativ) E.rascunho=null; E.ativ=ativ;
  E.emp=E.pagina==="emprestimos"&&sub==="novo"?"novo":null;
  const chave=(E.cr?"cr-"+E.comp+"-":"")+E.pagina+(E.pagina==="tesouraria"?"":"/"+(sub||""));
  E.chaveRota=chave;
  fechar(); desenhar();

  if(E.mostrarPendentes&&!E.cr){E.mostrarPendentes=false; janelaPendentes();}
}

const guiaoCarregado = new Set();
function carregarGuiao(url){
  if(guiaoCarregado.has(url)) return Promise.resolve();
  return new Promise((ok, falha) => {
    const el = document.createElement("script");
    el.src = url; el.async = true;
    el.onload = () => { guiaoCarregado.add(url); ok() };
    el.onerror = () => falha(new Error("Não consegui carregar o leitor. Confirmem a ligação à internet."));
    document.head.appendChild(el);
  });
}

function interpretarFatura(texto){
  const t = String(texto||"").replace(/\u00a0/g, " ");
  const achaValores = tx => [...tx.matchAll(/(\d{1,3}(?:[ .]\d{3})*|\d+)\s*[,.]\s*(\d{2})(?!\d)/g)]
    .map(m => ({valor: parseFloat(m[1].replace(/[ .]/g,"") + "." + m[2]), fim: m.index + m[0].length}))
    .filter(x => x.valor > 0 && x.valor < 100000);
  const todos = achaValores(t);
  let valor = null;
  /* primeiro, um valor logo a seguir a "total a pagar", "total" ou "valor" */
  const chaves = [...t.matchAll(/total\s*a\s*pagar|total\s*geral|valor\s*total|total|valor\s*a\s*pagar/gi)];
  for(const c of chaves.reverse()){
    const seguir = t.slice(c.index, c.index + 60);
    const v = achaValores(seguir)[0];
    if(v){ valor = v.valor; break }
  }
  /* se não houver palavra-chave, fica o maior valor da fatura */
  if(valor == null && todos.length) valor = Math.max(...todos.map(x => x.valor));
  let data = "";
  const d1 = t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})/);
  const d2 = t.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
  const dois = n => String(n).padStart(2,"0");
  if(d1 && +d1[2] >= 1 && +d1[2] <= 12) data = d1[3] + "-" + dois(d1[2]) + "-" + dois(d1[1]);
  else if(d2 && +d2[2] >= 1 && +d2[2] <= 12) data = d2[1] + "-" + dois(d2[2]) + "-" + dois(d2[3]);
  if(data && (data > iso(HOJE) || data < (ANO-2) + "-01-01")) data = "";
  return {valor, data};
}
async function lerFatura(ficheiro, aoProgresso){
  await carregarGuiao("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const r = await Tesseract.recognize(ficheiro, "por", {
    logger: m => { if(m.status === "recognizing text" && aoProgresso) aoProgresso(Math.round((m.progress||0)*100)) }
  });
  return interpretarFatura(r.data.text);
}

const tesVazia = () => ({iban:"",titulares:[],comprovativo:null,subsidios:[],faturas:[],orcamento:[],orcamentoFicheiro:null,reembolsos:[],admissoes:[],quotas:[]});
const bdVazia = () => ({pessoas:[],tesouraria:{},censos:{},atividades:[],inscricoes:{},emprestimos:[],alteracoes:[],prazos:{...PRAZOS},pessoasCR:[],config:{}});

function fatia(n){
  if(n === "cr") return {atividades:BD.atividades, prazos:BD.prazos};
  return {
    tesouraria: BD.tesouraria[n],
    censos: BD.censos[n],
    inscricoes: BD.inscricoes[n] || {},
    emprestimos: BD.emprestimos.filter(e => e.comp === n),
    alteracoes: BD.alteracoes.filter(a => a.comp === n)
  };
}
function juntar(n, d){
  if(n === "cr"){
    BD.atividades = d?.atividades || [];
    BD.prazos = {...PRAZOS, ...(d?.prazos || {})};
    Object.assign(PRAZOS, BD.prazos);
    return;
  }
  BD.tesouraria[n] = d?.tesouraria || tesVazia();
  BD.censos[n] = d?.censos || {historico:{}, atual:null};
  BD.inscricoes[n] = d?.inscricoes || {};
  BD.emprestimos.push(...(d?.emprestimos || []));
  BD.alteracoes.push(...(d?.alteracoes || []));
}
async function carregar(nomes){
  BD = bdVazia();
  const {data, error} = await sb.from("dados").select("comp, conteudo").in("comp", nomes);
  if(error) throw new Error("Não consegui ler os dados: " + error.message);
  const porComp = {};
  (data || []).forEach(l => porComp[l.comp] = l.conteudo);
  nomes.forEach(n => juntar(n, porComp[n]));
  const comps = nomes.filter(n => n !== "cr");
  if(comps.length){
    const r2 = await sb.from("pessoas").select("*").in("comp", comps);
    if(r2.error) throw new Error("Não consegui ler a patrulha: " + r2.error.message);
    BD.pessoas = (r2.data || []).map(linhaParaPessoa);
  }
  pessoasGuardadas = new Map(BD.pessoas.map(p => [p.id, JSON.stringify(pessoaParaLinha(p))]));
  const rPz = await sb.from("prazos").select("chave, data");
  if(rPz.error) throw new Error("Não consegui ler os prazos: " + rPz.error.message);
  (rPz.data || []).forEach(l => { BD.prazos[l.chave] = l.data || "" });
  Object.assign(PRAZOS, BD.prazos);
  prazosGuardados = JSON.stringify(BD.prazos);
  const rCf = await sb.from("config").select("chave, valor");
  BD.config = {};
  if(!rCf.error) (rCf.data || []).forEach(l => { BD.config[l.chave] = l.valor || "" });
  configGuardada = JSON.stringify(BD.config);
  if(BD.config.iban_cr) CR_IBAN = ibanFormatado(BD.config.iban_cr);
  const rCR = await sb.from("pessoas_cr").select("*");
  if(rCR.error) throw new Error("Não consegui ler os contactos do CR: " + rCR.error.message);
  BD.pessoasCR = (rCR.data || []).map(l => ({
    id:l.id, nome:l.nome, cargo:l.cargo||"", cargosExtra:l.cargos_extra||[],
    ramo:l.ramo||"", email:l.email||"", telemovel:l.telemovel||""
  }));
  crGuardadas = new Map(BD.pessoasCR.map(p => [p.id, JSON.stringify(crParaLinha(p))]));
  BD.alteracoes.sort((a,b) => String(b.quando).localeCompare(String(a.quando)));
  nomes.forEach(n => guardado[n] = JSON.stringify(fatia(n)));
}

async function gravarPessoas(){
  BD.pessoas.forEach(p => {
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(p.id))){
      p.id = crypto.randomUUID();
    }
  });
  const minhas = BD.pessoas.filter(p => E.cr || p.comp === E.comp);
  const porGravar = [];
  minhas.forEach(p => {
    const linha = pessoaParaLinha(p);
    if(pessoasGuardadas.get(p.id) !== JSON.stringify(linha)) porGravar.push(linha);
  });
  const vivas = new Set(minhas.map(p => p.id));
  const apagar = [...pessoasGuardadas.keys()].filter(id => !vivas.has(id));
  if(porGravar.length){
    const {error} = await sb.from("pessoas").upsert(porGravar);
    if(error) throw new Error("Não consegui gravar a patrulha: " + error.message);
  }
  if(apagar.length){
    const {error} = await sb.from("pessoas").delete().in("id", apagar);
    if(error) throw new Error("Não consegui remover da patrulha: " + error.message);
  }
  pessoasGuardadas = new Map(minhas.map(p => [p.id, JSON.stringify(pessoaParaLinha(p))]));
}
async function gravarCR(){
  if(!E.cr) return;
  BD.pessoasCR.forEach(p => {
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(p.id))) p.id = crypto.randomUUID();
  });
  const porGravar = [];
  BD.pessoasCR.forEach(p => {
    const linha = crParaLinha(p);
    if(crGuardadas.get(p.id) !== JSON.stringify(linha)) porGravar.push(linha);
  });
  const vivas = new Set(BD.pessoasCR.map(p => p.id));
  const apagar = [...crGuardadas.keys()].filter(id => !vivas.has(id));
  if(porGravar.length){
    const {error} = await sb.from("pessoas_cr").upsert(porGravar);
    if(error) throw new Error("Não consegui gravar os contactos do CR: " + error.message);
  }
  if(apagar.length){
    const {error} = await sb.from("pessoas_cr").delete().in("id", apagar);
    if(error) throw new Error("Não consegui remover do CR: " + error.message);
  }
  crGuardadas = new Map(BD.pessoasCR.map(p => [p.id, JSON.stringify(crParaLinha(p))]));
}
async function gravarPrazos(){
  if(!E.cr) return;
  if(JSON.stringify(BD.prazos) === prazosGuardados) return;
  for(const [chave, data] of Object.entries(BD.prazos)){
    const {error} = await sb.from("prazos").update({data: data || null}).eq("chave", chave);
    if(error) throw new Error("Não consegui gravar os prazos: " + error.message);
  }
  prazosGuardados = JSON.stringify(BD.prazos);
}
async function gravarConfig(){
  if(!E.cr) return;
  if(JSON.stringify(BD.config || {}) === configGuardada) return;
  for(const [chave, valor] of Object.entries(BD.config || {})){
    const {error} = await sb.from("config").update({valor: valor || null}).eq("chave", chave);
    if(error) throw new Error("Não consegui gravar as definições: " + error.message);
  }
  configGuardada = JSON.stringify(BD.config);
}
async function gravar(){
  if(!BD) return;
  estadoGravacao("A gravar…");
  await gravarPessoas();
  await gravarCR();
  await gravarPrazos();
  await gravarConfig();
  const alvos = E.cr ? ["cr", ...COMPANHIAS.map(c => c.id)] : [E.comp];
  for(const n of alvos){
    if(!n) continue;
    const texto = JSON.stringify(fatia(n));
    if(texto === guardado[n]) continue;
    const {error} = await sb.from("dados").update({conteudo: JSON.parse(texto)}).eq("comp", n);
    if(error) throw new Error("Não consegui gravar: " + error.message);
    guardado[n] = texto;
  }
  const agora = new Date();
  estadoGravacao("Guardado às " + String(agora.getHours()).padStart(2,"0") + ":" + String(agora.getMinutes()).padStart(2,"0"));
}
async function entrarComPasse(email, passe){
  const {data, error} = await sb.auth.signInWithPassword({email, password: passe});
  if(error){
    if(/invalid login/i.test(error.message)) throw new Error("Email ou palavra-passe incorretos.");
    if(/confirm/i.test(error.message)) throw new Error("Esta conta ainda não foi confirmada. Avisa o Comissariado Regional.");
    throw new Error(error.message);
  }
  return data.user.email;
}

  const ins=BD.inscricoes?.[id]||{};

  });

  return out;

function filtrarContactos(texto){
  E.crCt={comp:"",cargo:"",ramo:"",procura:"",...(E.crCt||{}),procura:texto};
  const v=texto.trim().toLowerCase(), corpo=document.querySelector(".tabela-ct tbody");

  let visiveis=0;
  [...corpo.rows].forEach(tr=>{ const bate = !v || tr.textContent.toLowerCase().includes(v); tr.hidden = !bate; if(bate) visiveis++ });
  const r=$("#ct-resumo");

  const k=e.target.dataset?.pedido; if(k&&E.pedido){E.pedido[k]=e.target.value; if(["usoI","usoF"].includes(k)){ if(k==="usoI"&&$("#p-usoF"))$("#p-usoF").min=e.target.value; atualizarPedido()} else atualizarPedido(true)}
});
document.addEventListener("submit",e=>{if(e.target.id==="formEntrada"){e.preventDefault();entrar()}});

(async function arranque(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(session?.user?.email){
      contaEmail = session.user.email;
      try{ history.replaceState(null, "", location.pathname) }catch(_){}
      await entrarComConta();
    }
    sb.auth.onAuthStateChange((evento, sessao) => {
      if(evento === "SIGNED_IN" && sessao?.user?.email && !E.comp && !E.cr){
        contaEmail = sessao.user.email;
        entrarComConta();
      }
    });
  }catch(e){ E.erro = "Não consegui ligar à base de dados: " + e.message; desenhar(); }
})();
